<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Timy</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #f7f7f8;
            --surface: #ffffff;
            --surface-2: #f0f0f2;
            --text: #1f1f23;
            --muted: #777780;
            --border: #e5e5e8;
            --primary: #111113;
            --primary-text: #ffffff;
            --timy-message: #ffffff;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: var(--bg);
            color: var(--text);

            min-height: 100vh;
        }

        /* APP */

        .app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */

        .header {
            height: 65px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 16px;

            background: var(--surface);
            border-bottom: 1px solid var(--border);

            position: sticky;
            top: 0;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;

            border-radius: 50%;

            background: var(--primary);
            color: var(--primary-text);

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: 700;
            font-size: 17px;
        }

        .avatar.small {
            width: 32px;
            height: 32px;
            font-size: 14px;
            flex-shrink: 0;
        }

        .brand-name {
            font-size: 18px;
            font-weight: 700;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 5px;

            font-size: 11px;
            color: var(--muted);
        }

        .status-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;
            background: #38b66a;
        }

        .menu-button {
            width: 40px;
            height: 40px;

            border: none;
            border-radius: 12px;

            background: transparent;

            font-size: 23px;

            cursor: pointer;
        }

        .menu-button:hover {
            background: var(--surface-2);
        }

        /* CHAT */

        .chat {
            width: 100%;
            max-width: 850px;

            margin: 0 auto;

            flex: 1;

            display: flex;
            flex-direction: column;
        }

        .messages {
            flex: 1;

            padding: 25px 16px 140px;

            display: flex;
            flex-direction: column;
            gap: 20px;

            overflow-y: auto;
        }

        .message-row {
            display: flex;
            gap: 9px;

            max-width: 90%;
        }

        .timy-row {
            align-self: flex-start;
        }

        .user-row {
            align-self: flex-end;
            justify-content: flex-end;
        }

        .message-content {
            min-width: 0;
        }

        .sender {
            font-size: 11px;
            font-weight: 600;
            color: var(--muted);

            margin-bottom: 4px;
        }

        .bubble {
            padding: 12px 14px;

            border-radius: 17px;

            font-size: 15px;
            line-height: 1.5;

            white-space: pre-wrap;
            overflow-wrap: break-word;
        }

        .timy-bubble {
            background: var(--timy-message);

            border: 1px solid var(--border);

            border-top-left-radius: 5px;
        }

        .user-bubble {
            background: var(--primary);
            color: var(--primary-text);

            border-top-right-radius: 5px;
        }

        .time {
            margin-top: 4px;

            font-size: 9px;
            color: var(--muted);
        }

        /* TYPING */

        .typing {
            display: flex;
            gap: 4px;

            padding: 14px 16px;
        }

        .typing span {
            width: 6px;
            height: 6px;

            border-radius: 50%;
            background: #999;

            animation: typing 1.2s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: .15s;
        }

        .typing span:nth-child(3) {
            animation-delay: .3s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: .4;
            }

            30% {
                transform: translateY(-4px);
                opacity: 1;
            }
        }

        /* INPUT */

        .input-area {
            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            padding: 10px 10px 13px;

            background: linear-gradient(
                to top,
                var(--bg) 75%,
                transparent
            );

            z-index: 5;
        }

        .input-box {
            max-width: 820px;

            margin: auto;

            display: flex;
            align-items: flex-end;
            gap: 7px;

            padding: 7px 7px 7px 14px;

            background: var(--surface);

            border: 1px solid var(--border);

            border-radius: 20px;

            box-shadow: 0 8px 30px rgba(0,0,0,.08);
        }

        textarea {
            flex: 1;

            resize: none;

            border: none;
            outline: none;

            background: transparent;

            color: var(--text);

            font-family: inherit;
            font-size: 15px;

            line-height: 22px;

            max-height: 120px;

            padding: 7px 0;
        }

        textarea::placeholder {
            color: #9999a1;
        }

        .send {
            width: 38px;
            height: 38px;

            flex-shrink: 0;

            border: none;
            border-radius: 50%;

            background: var(--primary);
            color: var(--primary-text);

            font-size: 21px;
            font-weight: bold;

            cursor: pointer;
        }

        .send:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        .note {
            max-width: 820px;

            margin: 6px auto 0;

            text-align: center;

            font-size: 9px;
            color: var(--muted);
        }

        /* SIDE MENU */

        .side-menu {
            position: fixed;

            top: 0;
            right: 0;

            width: min(310px, 85vw);
            height: 100vh;

            padding: 20px;

            background: var(--surface);

            z-index: 30;

            transform: translateX(100%);

            transition: transform .25s ease;

            box-shadow: -10px 0 30px rgba(0,0,0,.1);
        }

        .side-menu.open {
            transform: translateX(0);
        }

        .menu-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 25px;
        }

        .menu-header h2 {
            font-size: 21px;
        }

        .close {
            width: 40px;
            height: 40px;

            border: none;
            border-radius: 12px;

            background: var(--surface-2);

            font-size: 25px;

            cursor: pointer;
        }

        .menu-item {
            width: 100%;

            display: flex;
            align-items: center;
            gap: 12px;

            padding: 14px;

            margin-bottom: 5px;

            border: none;
            border-radius: 12px;

            background: transparent;

            color: var(--text);

            font-size: 15px;

            text-align: left;

            cursor: pointer;
        }

        .menu-item:hover {
            background: var(--surface-2);
        }

        /* OVERLAY */

        .overlay {
            position: fixed;
            inset: 0;

            background: rgba(0,0,0,.35);

            z-index: 20;

            opacity: 0;
            visibility: hidden;

            transition: .25s;
        }

        .overlay.open {
            opacity: 1;
            visibility: visible;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .header {
                height: 60px;
            }

            .messages {
                padding: 20px 12px 140px;
            }

            .message-row {
                max-width: 93%;
            }

            .bubble {
                font-size: 15px;
            }
        }

        /* DARK MODE */

        @media (prefers-color-scheme: dark) {

            :root {
                --bg: #111113;
                --surface: #1b1b1f;
                --surface-2: #27272c;

                --text: #f1f1f3;
                --muted: #a0a0aa;

                --border: #303036;

                --primary: #f1f1f3;
                --primary-text: #111113;

                --timy-message: #1b1b1f;
            }

            .input-area {
                background: linear-gradient(
                    to top,
                    var(--bg) 75%,
                    transparent
                );
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="header">

        <div class="brand">

            <div class="avatar">
                T
            </div>

            <div>
                <div class="brand-name">
                    Timy
                </div>

                <div class="status">
                    <span class="status-dot"></span>
                    Online
                </div>
            </div>

        </div>

        <button
            class="menu-button"
            id="menuButton"
        >
            ☰
        </button>

    </header>


    <!-- CHAT -->
    <main class="chat">

        <div
            class="messages"
            id="messages"
        >

            <!-- WELCOME MESSAGE -->

            <div class="message-row timy-row">

                <div class="avatar small">
                    T
                </div>

                <div class="message-content">

                    <div class="sender">
                        Timy
                    </div>

                    <div class="bubble timy-bubble">
                        Hey! 👋

                        I'm Timy. Nice to meet you!

                        Aku Timy, AI companion yang sedang kita bangun. 😄
                    </div>

                    <div class="time">
                        Now
                    </div>

                </div>

            </div>

        </div>


        <!-- INPUT -->

        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="messageInput"
                    rows="1"
                    maxlength="2000"
                    placeholder="Message Timy..."
                ></textarea>

                <button
                    class="send"
                    id="sendButton"
                >
                    ↑
                </button>

            </div>

            <div class="note">
                Timy prototype • AI response
            </div>

        </div>

    </main>


    <!-- SIDE MENU -->

    <aside
        class="side-menu"
        id="sideMenu"
    >

        <div class="menu-header">

            <h2>
                Timy
            </h2>

            <button
                class="close"
                id="closeMenu"
            >
                ×
            </button>

        </div>


        <button
            class="menu-item"
            id="newChat"
        >
            💬 &nbsp; New Chat
        </button>

        <button class="menu-item">
            🗂️ &nbsp; Conversations
        </button>

        <button class="menu-item">
            🧠 &nbsp; Memory
        </button>

        <button class="menu-item">
            ⚙️ &nbsp; Settings
        </button>

        <button class="menu-item">
            ⓘ &nbsp; About Timy
        </button>

    </aside>


    <!-- OVERLAY -->

    <div
        class="overlay"
        id="overlay"
    ></div>

</div>


<script>

    // ========================================
    // ELEMENTS
    // ========================================

    const messages =
        document.getElementById("messages");

    const input =
        document.getElementById("messageInput");

    const sendButton =
        document.getElementById("sendButton");

    const menuButton =
        document.getElementById("menuButton");

    const sideMenu =
        document.getElementById("sideMenu");

    const closeMenu =
        document.getElementById("closeMenu");

    const overlay =
        document.getElementById("overlay");

    const newChat =
        document.getElementById("newChat");


    // ========================================
    // SEND MESSAGE
    // ========================================

    async function sendMessage() {

        const text =
            input.value.trim();

        if (!text || sendButton.disabled) {
            return;
        }

        addUserMessage(text);

        input.value = "";

        resetInput();

        sendButton.disabled = true;

        showTyping();

        try {
            const response = await fetch("/api/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: text
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Request gagal.");
            }

            removeTyping();
            addTimyMessage(data.reply);

        } catch (error) {
            console.error("Timy chat error:", error);

            removeTyping();
            addTimyMessage(
                "Maaf, Timy sedang mengalami masalah. Coba lagi sebentar."
            );

        } finally {
            sendButton.disabled = false;
            input.focus();
        }
    }


    // ========================================
    // USER MESSAGE
    // ========================================

    function addUserMessage(text) {

        const row =
            document.createElement("div");

        row.className =
            "message-row user-row";

        const content =
            document.createElement("div");

        content.className =
            "message-content";

        const bubble =
            document.createElement("div");

        bubble.className =
            "bubble user-bubble";

        bubble.textContent =
            text;

        const time =
            document.createElement("div");

        time.className =
            "time";

        time.textContent =
            "Now";

        content.appendChild(bubble);
        content.appendChild(time);

        row.appendChild(content);

        messages.appendChild(row);

        scrollBottom();
    }


    // ========================================
    // TIMY MESSAGE
    // ========================================

    function addTimyMessage(text) {

        const row =
            document.createElement("div");

        row.className =
            "message-row timy-row";

        const avatar =
            document.createElement("div");

        avatar.className =
            "avatar small";

        avatar.textContent =
            "T";

        const content =
            document.createElement("div");

        content.className =
            "message-content";

        const sender =
            document.createElement("div");

        sender.className =
            "sender";

        sender.textContent =
            "Timy";

        const bubble =
            document.createElement("div");

        bubble.className =
            "bubble timy-bubble";

        bubble.textContent =
            text;

        const time =
            document.createElement("div");

        time.className =
            "time";

        time.textContent =
            "Now";

        content.appendChild(sender);
        content.appendChild(bubble);
        content.appendChild(time);

        row.appendChild(avatar);
        row.appendChild(content);

        messages.appendChild(row);

        scrollBottom();
    }


    // ========================================
    // TYPING INDICATOR
    // ========================================

    function showTyping() {

        const row =
            document.createElement("div");

        row.className =
            "message-row timy-row";

        row.id =
            "typingIndicator";

        row.innerHTML = `
            <div class="avatar small">T</div>

            <div class="message-content">

                <div class="sender">
                    Timy
                </div>

                <div class="bubble timy-bubble typing">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

            </div>
        `;

        messages.appendChild(row);

        scrollBottom();
    }


    function removeTyping() {

        const typing =
            document.getElementById(
                "typingIndicator"
            );

        if (typing) {
            typing.remove();
        }
    }


    // ========================================
    // AUTO SCROLL
    // ========================================

    function scrollBottom() {

        setTimeout(() => {

            messages.scrollTo({
                top: messages.scrollHeight,
                behavior: "smooth"
            });

        }, 50);
    }


    // ========================================
    // TEXTAREA
    // ========================================

    input.addEventListener(
        "input",
        () => {

            input.style.height =
                "auto";

            input.style.height =
                Math.min(
                    input.scrollHeight,
                    120
                ) + "px";
        }
    );


    function resetInput() {

        input.style.height =
            "auto";
    }


    // ========================================
    // ENTER
    // ========================================

    input.addEventListener(
        "keydown",
        (event) => {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();
            }

        }
    );


    // ========================================
    // SEND BUTTON
    // ========================================

    sendButton.addEventListener(
        "click",
        sendMessage
    );


    // ========================================
    // MENU
    // ========================================

    function openMenu() {

        sideMenu.classList.add("open");

        overlay.classList.add("open");
    }


    function closeSideMenu() {

        sideMenu.classList.remove("open");

        overlay.classList.remove("open");
    }


    menuButton.addEventListener(
        "click",
        openMenu
    );

    closeMenu.addEventListener(
        "click",
        closeSideMenu
    );

    overlay.addEventListener(
        "click",
        closeSideMenu
    );


    // ========================================
    // NEW CHAT
    // ========================================

    newChat.addEventListener(
        "click",
        () => {

            messages.innerHTML = `
                <div class="message-row timy-row">

                    <div class="avatar small">
                        T
                    </div>

                    <div class="message-content">

                        <div class="sender">
                            Timy
                        </div>

                        <div class="bubble timy-bubble">
                            New chat! 👋

                            What do you want to talk about?
                        </div>

                        <div class="time">
                            Now
                        </div>

                    </div>

                </div>
            `;

            closeSideMenu();

            input.value = "";

            resetInput();

            input.focus();

        }
    );


    // ========================================
    // START
    // ========================================

    console.log(
        "Timy frontend loaded successfully."
    );

    input.focus();

</script>

</body>
</html>
